name: Deploy to Digital Ocean

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'master'
        type: choice
        options:
          - master
          - dev
          - feature/chat-widget-cosmetics
      run_seed:
        description: 'Run database seeding after deployment?'
        required: false
        default: false
        type: boolean

jobs:
  deploy:
    name: Deploy to Droplet
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          PRODUCTION_ENV: ${{ secrets.PRODUCTION_ENV }}
          DEPLOY_BRANCH: ${{ inputs.branch }}
          RUN_SEED: ${{ inputs.run_seed }}
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          envs: PRODUCTION_ENV,DEPLOY_BRANCH,RUN_SEED
          script: |
            set -euo pipefail

            APP_DIR=~/OpenThrone-v2

            echo "==> Checking for rogue PM2 daemons"
            # If another user (e.g. root) is running PM2 on our ports, we can't kill it.
            # Fail fast with a clear message so the operator can SSH in and fix it.
            for PORT in 3000 3001; do
              OWNER=$(fuser -v ${PORT}/tcp 2>&1 | awk 'NR==2{print $2}' || true)
              if [ -n "$OWNER" ] && [ "$OWNER" != "$(whoami)" ]; then
                echo "FATAL: Port $PORT is held by user '$OWNER' (not '$(whoami)')."
                echo "This usually means someone ran 'pm2 start' as $OWNER."
                echo "Fix: SSH as $OWNER and run 'pm2 delete all && pm2 kill'"
                fuser -v ${PORT}/tcp 2>&1 || true
                exit 1
              fi
            done

            echo "==> Stopping PM2 processes and killing orphan ports"
            cd "$APP_DIR"
            pm2 stop all 2>/dev/null || true
            pm2 delete all 2>/dev/null || true
            sleep 2
            fuser -k 3000/tcp 2>/dev/null || true
            fuser -k 3001/tcp 2>/dev/null || true
            sleep 2
            # Verify ports are free
            if fuser 3000/tcp 2>/dev/null || fuser 3001/tcp 2>/dev/null; then
              echo "ERROR: Ports still in use after cleanup, force killing..."
              fuser -k -9 3000/tcp 2>/dev/null || true
              fuser -k -9 3001/tcp 2>/dev/null || true
              sleep 2
            fi
            echo "Ports 3000/3001 are free"

            echo "==> Pulling latest code from branch: $DEPLOY_BRANCH"
            git fetch origin "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            git clean -fd
            rm -rf apps/web/.next apps/api/dist node_modules/.cache/turbo

            echo "==> Writing production .env"
            printf '%s\n' "$PRODUCTION_ENV" > .env

            # Symlink .env into subdirectories that need it
            ln -sf "$APP_DIR/.env" "$APP_DIR/packages/db/.env"
            ln -sf "$APP_DIR/.env" "$APP_DIR/apps/web/.env"
            ln -sf "$APP_DIR/.env" "$APP_DIR/apps/api/.env"

            echo "==> Swapping Prisma provider to postgresql"
            sed -i 's/provider = "sqlite"/provider = "postgresql"/' packages/db/prisma/schema.prisma

            echo "==> Installing dependencies"
            pnpm install --frozen-lockfile

            echo "==> Generating Prisma client & pushing schema"
            pnpm db:generate
            pnpm db:push

            echo "==> Building all packages (--force skips Turborepo cache)"
            NODE_OPTIONS="--max-old-space-size=1536" pnpm build --force

            echo "==> Restoring Prisma schema (keep sqlite for git)"
            git checkout packages/db/prisma/schema.prisma

            if [ "$RUN_SEED" = "true" ]; then
              echo "==> Running database seed"
              pnpm db:seed
            else
              echo "==> Skipping database seed (not requested)"
            fi

            echo "==> Starting PM2 processes"
            pm2 start ecosystem.config.cjs
            pm2 save

            echo "==> Health check (retrying up to 30s)"
            API_OK=0
            WEB_OK=0
            for i in $(seq 1 6); do
              sleep 5
              if [ "$API_OK" -eq 0 ]; then
                HTTP=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3001/api 2>/dev/null || echo "000")
                if echo "$HTTP" | grep -qE '^[2-4]'; then API_OK=1; echo "API healthy (attempt $i, HTTP $HTTP)"; fi
              fi
              if [ "$WEB_OK" -eq 0 ]; then
                HTTP=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000 2>/dev/null || echo "000")
                if echo "$HTTP" | grep -qE '^[2-3]'; then WEB_OK=1; echo "Web healthy (attempt $i, HTTP $HTTP)"; fi
              fi
              if [ "$API_OK" -eq 1 ] && [ "$WEB_OK" -eq 1 ]; then break; fi
            done

            # Fail deploy if either service didn't come up
            if [ "$API_OK" -eq 0 ]; then
              echo "FATAL: API failed to start"
              pm2 logs api --lines 20 --nostream
              exit 1
            fi
            if [ "$WEB_OK" -eq 0 ]; then
              echo "FATAL: Web failed to start"
              pm2 logs web --lines 20 --nostream
              exit 1
            fi

            echo "==> Deploy complete — both services healthy"
